name: Acquire Lab 3 data

on:
  push:
    branches: [main]
    paths:
      - lab3/scrape_books.py
      - .github/workflows/acquire-lab3-data.yml

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python lab3/scrape_books.py
      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab3_data.csv
          if ! git diff --cached --quiet; then
            git commit -m "Generate 1,200 Lab 3 book records"
            git push
          fi
