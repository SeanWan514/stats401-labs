name: Build Lab 4 sentiment data

on:
  push:
    branches: [main]
    paths:
      - data/lab4_raw_tweets.csv
      - lab4/clean_tweets.py
      - .github/workflows/build-lab4-data.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn transformers torch
      - run: python lab4/clean_tweets.py
      - name: Commit validated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab4_clean_tweets.csv data/lab4_sentiment_by_category.csv data/lab4_top_terms.csv
          if ! git diff --cached --quiet; then
            git commit -m "Generate Lab 4 RoBERTa sentiment data"
            git push
          fi
